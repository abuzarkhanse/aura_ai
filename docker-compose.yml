services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_dev_password
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - aura_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aura_redis_data:/data

volumes:
  aura_postgres_data:
  aura_redis_data:
